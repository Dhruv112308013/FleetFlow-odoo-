{% extends 'base.html' %}

{% block title %}Register Driver | FleetFlow{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-8 px-4">
    <div class="mb-10">
        <h1 class="text-4xl font-extrabold tracking-tight text-main">Register New Driver</h1>
        <p class="mt-3 font-medium text-muted">Onboard a new operator to the fleet management system with secure credentials.</p>
    </div>

    <div class="glass-card rounded-2xl p-8 md:p-12 shadow-2xl">
        <form action="{{ url_for('drivers.register') }}" method="POST" class="space-y-10">
            <!-- Account Information Section -->
            <div class="animate-slide-up" style="animation-delay: 0.1s;">
                <h3 class="text-xl font-bold mb-8 flex items-center text-main">
                    <span class="w-10 h-10 rounded-xl flex items-center justify-center mr-4 text-sm font-black" style="background-color: rgba(59, 130, 246, 0.1); color: var(--primary);">01</span>
                    Account Credentials
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="input-group">
                        <label class="block text-sm font-bold mb-2.5 text-muted">Username</label>
                        <input type="text" name="username" required placeholder="jdoe_driver"
                            class="block w-full px-5 py-3.5 rounded-xl focus:outline-none placeholder:text-slate-600 font-medium"
                            style="background-color: var(--bg-surface); border: 1px solid var(--card-border); color: var(--text-main);">
                    </div>
                    <div class="input-group">
                        <label class="block text-sm font-bold mb-2.5 text-muted">Email Address</label>
                        <input type="email" name="email" required placeholder="john.doe@example.com"
                            class="block w-full px-5 py-3.5 rounded-xl focus:outline-none placeholder:text-slate-600 font-medium"
                            style="background-color: var(--bg-surface); border: 1px solid var(--card-border); color: var(--text-main);">
                    </div>
                    <div class="input-group">
                        <label class="block text-sm font-bold mb-2.5 text-muted">Password</label>
                        <input type="password" name="password" required placeholder="••••••••"
                            class="block w-full px-5 py-3.5 rounded-xl focus:outline-none placeholder:text-slate-600 font-medium"
                            style="background-color: var(--bg-surface); border: 1px solid var(--card-border); color: var(--text-main);">
                    </div>
                </div>
            </div>

            <div class="border-t" style="border-color: var(--card-border);"></div>

            <!-- Personal Information Section -->
            <div class="animate-slide-up" style="animation-delay: 0.2s;">
                <h3 class="text-xl font-bold mb-8 flex items-center text-main">
                    <span class="w-10 h-10 rounded-xl flex items-center justify-center mr-4 text-sm font-black" style="background-color: rgba(16, 185, 129, 0.1); color: #10b981;">02</span>
                    Personal & Licensing
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="input-group">
                        <label class="block text-sm font-bold mb-2.5 text-muted">Full Name</label>
                        <input type="text" name="full_name" required placeholder="John Doe"
                            class="block w-full px-5 py-3.5 rounded-xl focus:outline-none placeholder:text-slate-600 font-medium"
                            style="background-color: var(--bg-surface); border: 1px solid var(--card-border); color: var(--text-main);">
                    </div>
                    <div class="input-group">
                        <label class="block text-sm font-bold mb-2.5 text-muted">License Number</label>
                        <input type="text" name="license_number" required placeholder="ABC-12345-XYZ"
                            class="block w-full px-5 py-3.5 rounded-xl focus:outline-none placeholder:text-slate-600 font-medium"
                            style="background-color: var(--bg-surface); border: 1px solid var(--card-border); color: var(--text-main);">
                    </div>
                    <div class="input-group">
                        <label class="block text-sm font-bold mb-2.5 text-muted">License Expiry Date</label>
                        <input type="date" name="license_expiry" required
                            class="block w-full px-5 py-3.5 rounded-xl focus:outline-none appearance-none font-medium text-main text-main"
                            style="background-color: var(--bg-surface); border: 1px solid var(--card-border); color-scheme: dark;">
                    </div>
                </div>
            </div>

            <div class="pt-8 flex items-center justify-end space-x-6 animate-slide-up" style="animation-delay: 0.3s;">
                <a href="{{ url_for('drivers.index') }}" class="px-6 py-3 text-sm font-bold hover:text-white transition-colors tracking-wide" style="color: var(--text-muted);">
                    Cancel Registration
                </a>
                <button type="submit" 
                    class="btn-primary flex justify-center items-center py-4 px-10 rounded-2xl text-white font-black text-sm tracking-widest uppercase shadow-lg shadow-blue-500/25"
                    style="background-color: var(--primary);">
                    Register Driver
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
