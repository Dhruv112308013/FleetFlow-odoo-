{% extends "base.html" %}

{% block title %}Complete Trip #{{ trip.trip_number }}{% endblock %}

{% block content %}
<div class="max-w-md bg-white rounded-xl shadow-2xl p-8 border border-gray-100 mx-auto">
    <div class="text-center mb-6">
        <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">✓</div>
        <h3 class="text-lg font-bold">Trip Completion</h3>
        <p class="text-sm text-gray-500">Log final details for vehicle {{ trip.vehicle.license_plate }}</p>
    </div>

    <form action="{{ url_for('trips.complete', id=trip.id) }}" method="POST" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Starting Odometer</label>
            <input type="text" disabled value="{{ trip.vehicle.current_odometer }}" 
                class="w-full px-4 py-2 bg-gray-100 border border-transparent rounded-lg text-gray-500 italic">
        </div>
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Current Odometer Reading</label>
            <input type="number" name="end_odometer" required 
                min="{{ trip.vehicle.current_odometer + 1 }}"
                class="w-full px-4 py-2 bg-gray-50 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <p class="mt-1 text-xs text-blue-600 font-medium">Business Rule: Odometer must be greater than starting value.</p>
        </div>

        <div class="flex flex-col space-y-3">
            <button type="submit" class="w-full py-2 bg-green-600 text-white rounded-lg font-bold shadow-lg hover:bg-green-700 transition">
                Mark as Completed
            </button>
            <a href="{{ url_for('trips.index') }}" class="w-full py-2 bg-gray-100 text-gray-700 rounded-lg text-center font-medium hover:bg-gray-200 transition">
                Back to Dispatcher
            </a>
        </div>
    </form>
</div>
{% endblock %}
