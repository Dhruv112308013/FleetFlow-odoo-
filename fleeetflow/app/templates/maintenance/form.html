{% extends "base.html" %}

{% block title %}Log Vehicle Maintenance{% endblock %}

{% block content %}
<div class="max-w-3xl bg-white rounded-xl shadow-lg p-8 border border-gray-100 mx-auto">
    <form action="{{ url_for('maintenance.add') }}" method="POST" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Select Vehicle</label>
                <select name="vehicle_id" required class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none">
                    {% for v in vehicles %}
                    <option value="{{ v.id }}">{{ v.license_plate }} ({{ v.status.value }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Service Date</label>
                <input type="date" name="service_date" required 
                    class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Service Type</label>
                <input type="text" name="service_type" required placeholder="e.g. Engine Oil Change, Tire Rotation"
                    class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Service Cost (₹)</label>
                <input type="number" step="0.01" name="cost" required
                    class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Odometer at Service (km)</label>
                <input type="number" name="odometer_at_service" required
                    class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Performed By</label>
                <input type="text" name="performed_by" required placeholder="Workshop/Mechanic Name"
                    class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Detailed Description</label>
                <textarea name="description" rows="3" 
                    class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none"></textarea>
            </div>
        </div>

        <div class="pt-6 border-t border-gray-100 flex justify-end space-x-4">
            <a href="{{ url_for('maintenance.index') }}" class="px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition font-medium">Cancel</a>
            <button type="submit" class="px-6 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 transition font-bold shadow-md">
                Save Maintenance Log
            </button>
        </div>
    </form>
    
    <div class="mt-8 p-4 bg-blue-50 rounded-lg border border-blue-100 flex items-start">
        <svg class="w-5 h-5 text-blue-500 mt-0.5 mr-3" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
        </svg>
        <p class="text-sm text-blue-700">
            <strong>Pro Tip:</strong> Saving this log will automatically set the vehicle status to <strong>"In Shop"</strong>, removing it from dispatcher availability until released.
        </p>
    </div>
</div>
{% endblock %}
